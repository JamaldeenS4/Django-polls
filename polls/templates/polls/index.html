{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Poll Questions</title>
        <link rel="stylesheet" href="{% static 'polls/styles.css' %}">
    </head>
    <body>
        <main class="page-shell">
            <header class="page-header">
                <p class="eyebrow">Community polls</p>
                <h1>Questions</h1>
            </header>

            {% if latest_question_list %}
                <div class="questions-panel">
                    <ul class="questions-list">
                        {% for question in latest_question_list %}
                            <li class="question-item">
                                <a class="question-link" href="{% url 'polls:detail' question.id %}">
                                    {{ question.question_text }}
                                </a>
                            </li>
                        {% endfor %}
                    </ul>
                </div>
            {% else %}
                <p class="empty-state">No polls are available.</p>
            {% endif %}
        </main>
    </body>
</html>
